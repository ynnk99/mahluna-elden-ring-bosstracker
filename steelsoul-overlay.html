<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steel Soul Overlay</title>
<script src="vendor/papaparse.min.js"></script>
<style>
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:600; font-display:swap;
    src:url('fonts/cinzel-latin-600-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'Cinzel'; font-style:normal; font-weight:700; font-display:swap;
    src:url('fonts/cinzel-latin-700-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'EB Garamond'; font-style:normal; font-weight:400; font-display:swap;
    src:url('fonts/eb-garamond-latin-400-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'EB Garamond'; font-style:normal; font-weight:600; font-display:swap;
    src:url('fonts/eb-garamond-latin-600-normal.woff2') format('woff2');
  }
  @font-face{
    font-family:'EB Garamond'; font-style:italic; font-weight:400; font-display:swap;
    src:url('fonts/eb-garamond-latin-400-italic.woff2') format('woff2');
  }
  html,body{
    margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:'EB Garamond',Georgia,serif; color:#f1f7f8;
  }
  .overlay-box{
    position:relative; display:inline-flex; align-items:center; gap:28px;
    background:linear-gradient(180deg, rgba(15,22,30,0.88), rgba(6,9,14,0.88));
    border:1px solid rgba(199,167,94,0.5);
    border-radius:14px;
    padding:22px 36px;
    box-shadow:0 0 40px rgba(0,0,0,0.6), inset 0 0 36px rgba(127,214,206,0.05);
    backdrop-filter:blur(2px);
  }
  .overlay-box .corner{position:absolute; width:12px; height:12px; border:1px solid #c7a75e; opacity:0.65;}
  .overlay-box .c-tl{top:7px; left:7px; border-right:none; border-bottom:none;}
  .overlay-box .c-tr{top:7px; right:7px; border-left:none; border-bottom:none;}
  .overlay-box .c-bl{bottom:7px; left:7px; border-right:none; border-top:none;}
  .overlay-box .c-br{bottom:7px; right:7px; border-left:none; border-top:none;}

  .attempt-block{text-align:center; padding-right:28px; border-right:1px solid rgba(140,185,195,0.3);}
  .attempt-label{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.18em; text-transform:uppercase; color:#9fb3ba;}
  .attempt-number{font-family:'Cinzel',serif; font-size:76px; font-weight:700; color:#c3f5ee; line-height:1; text-shadow:0 0 26px rgba(127,214,206,0.6); margin-top:2px;}

  .info-block{display:flex; flex-direction:column; gap:10px; min-width:200px;}
  .info-row{font-size:22px; display:flex; align-items:baseline; gap:10px;}
  .info-row .k{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.04em; color:#9fb3ba; font-style:normal;}
  .info-row .v{color:#f1f7f8; font-weight:600; font-size:26px;}
  .info-row.pb .v{color:#d5c8ff; text-shadow:0 0 14px rgba(164,138,240,0.4);}
</style>
</head>
<body>
  <div class="overlay-box" id="overlay-box">
    <span class="corner c-tl"></span><span class="corner c-tr"></span><span class="corner c-bl"></span><span class="corner c-br"></span>
    <div class="attempt-block">
      <div class="attempt-label">Versuch</div>
      <div class="attempt-number" id="ov-attempt">–</div>
    </div>
    <div class="info-block">
      <div class="info-row"><span class="k">Bosse (aktuell)</span><span class="v" id="ov-bosses">–</span></div>
      <div class="info-row pb"><span class="k">PB</span><span class="v" id="ov-pb">–</span></div>
    </div>
  </div>

<script src="steelsoul-config.js"></script>
<script src="steelsoul-data.js"></script>
<script>
  function bossLabel(n){ return n + (n === 1 ? ' Boss' : ' Bosse'); }

  function render(runs, stats){
    document.getElementById('ov-attempt').textContent = stats.currentAttempt ?? '–';
    document.getElementById('ov-pb').textContent = stats.bestBossesKilled ? bossLabel(stats.bestBossesKilled) : '–';

    const current = stats.currentRun;
    document.getElementById('ov-bosses').textContent = current ? bossLabel(current.bossesKilled) : '–';
  }

  // Overlay bleibt bei Fehlern einfach beim letzten bekannten Stand stehen
  SteelSoul.startPolling(render, (err) => console.error('Steel Soul Overlay:', err));
</script>
</body>
</html>
